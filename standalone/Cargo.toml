[package]
name = "roc_desk_explorer_standalone"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
roc_desk_explorer = { path = "../lib" }
tauri = { version = "2", features = ["wry"] }
serde = { version = "1", features = ["derive"] }
roc_desk_common = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_common", tag = "common-v0.2.6" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

